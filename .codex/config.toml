# Repository-scoped MCP servers. Codex loads this file for trusted projects.
[mcp_servers.agentic-qe]
type = "stdio"
command = "npx"
args = ["--yes", "agentic-qe@3.14.1", "mcp"]
cwd = "/workspaces/community-social-network"
startup_timeout_sec = 90
tool_timeout_sec = 300

[mcp_servers.agentic-qe.env]
AQE_MEMORY_PATH = ".agentic-qe/memory.db"
AQE_PROJECT_ROOT = "/workspaces/community-social-network"
AQE_LEARNING_ENABLED = "true"
AQE_V3_MODE = "true"

[mcp_servers.ruflo]
type = "stdio"
command = "npx"
args = ["--yes", "ruflo@3.41.1", "mcp", "start"]
cwd = "/workspaces/community-social-network"
startup_timeout_sec = 90
tool_timeout_sec = 300
enabled_tools = [
  "swarm_init",
  "swarm_status",
  "swarm_health",
  "agent_spawn",
  "agent_status",
  "agent_list",
  "coordination_orchestrate",
  "memory_search",
  "memory_store",
  "memory_retrieve",
]

[mcp_servers.ruflo.env]
CLAUDE_FLOW_CWD = "/workspaces/community-social-network"
CLAUDE_FLOW_MODE = "v3"
CLAUDE_FLOW_HOOKS_ENABLED = "true"
CLAUDE_FLOW_TOPOLOGY = "hierarchical-mesh"
CLAUDE_FLOW_MAX_AGENTS = "15"
CLAUDE_FLOW_MEMORY_BACKEND = "hybrid"
